name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly smoke evaluation (Monday 06:17 UTC)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"

jobs:
  backend:
    name: Backend (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - name: Install dependencies and tokenizer
        run: |
          uv sync --all-groups --frozen
          uv run python -m text2sql.llm.tokens
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests
      - run: uv run pytest

  adversarial:
    name: Adversarial guardrails (offline)
    # Required check on main: every attack in eval/datasets/adversarial.jsonl that the input
    # rules or the SQL validator must stop is replayed on every push, without any model.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - run: uv sync --all-groups --frozen
      - name: Attacks against the input rules and the SQL validator
        run: uv run pytest -q tests/eval/test_datasets.py -k "attack or benign_questions_pass_layer_1" tests/guard

  security:
    name: Security scans (pip-audit, pnpm audit, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - name: pip-audit (all Python dependencies)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --no-hashes -o /tmp/requirements-audit.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements-audit.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: pnpm audit (production dependencies fail the build, dev tooling is reported)
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level high || echo "::warning::dev-only findings, see docs/threat-model.md"
      - name: Build both images
        run: |
          docker build -t text2sql-guard-api backend
          docker build -t text2sql-guard-web frontend
      - name: Trivy (fixable HIGH/CRITICAL vulnerabilities, baked-in secrets)
        run: |
          for image in text2sql-guard-api text2sql-guard-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.69.3 image --quiet --scanners vuln,secret \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  eval-smoke:
    name: Eval smoke (accuracy >= 75%, attack block rate = 100%)
    needs: backend
    runs-on: ubuntu-latest
    # Real data and real (free-tier) models: about 40 LLM requests per run, so it runs on the
    # weekly schedule and on manual dispatch only, never on every push. It needs the Gemini key
    # and a way to get the Olist data (Kaggle credentials); without them it skips itself.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: eval-smoke  # never two runs spending the same quota at once
      cancel-in-progress: false
    env:
      HAS_SECRETS: ${{ secrets.GEMINI_API_KEY != '' && secrets.KAGGLE_USERNAME != '' && secrets.KAGGLE_KEY != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip without secrets
        if: env.HAS_SECRETS != 'true'
        working-directory: ${{ github.workspace }}  # backend/ does not exist before checkout
        run: echo "::notice::eval-smoke skipped. Add the GEMINI_API_KEY, KAGGLE_USERNAME and KAGGLE_KEY repository secrets to enable it."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - name: Install uv and dependencies
        if: env.HAS_SECRETS == 'true'
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          uv sync --all-groups --frozen
          uv run python -m text2sql.llm.tokens
      - name: Write a throwaway .env (random local passwords, keys from secrets)
        if: env.HAS_SECRETS == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pw() { python3 -c "import secrets; print(secrets.token_urlsafe(24))"; }
          PG=$(pw); RD=$(pw); RE=$(pw); AP=$(pw)
          {
            echo "APP_ENV=test"
            echo "POSTGRES_USER=text2sql"; echo "POSTGRES_PASSWORD=$PG"; echo "POSTGRES_DB=text2sql"
            echo "REDIS_PASSWORD=$RD"
            echo "DATABASE_URL=postgresql+asyncpg://text2sql:$PG@127.0.0.1:5432/text2sql"
            echo "READER_DATABASE_URL=postgresql+asyncpg://t2s_reader:$RE@127.0.0.1:5432/text2sql"
            echo "APP_DATABASE_URL=postgresql+asyncpg://t2s_app:$AP@127.0.0.1:5432/text2sql"
            echo "REDIS_URL=redis://:$RD@127.0.0.1:6379/0"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            grep -E '^LLM_' .env.example | grep -vE '^LLM_(MODEL_MAIN|FALLBACK_)'
            # gemini-3.8-flash allows 20 requests a day: CI uses flash-lite, no Groq fallback
            # (Groq's daily tokens are kept for evaluations), concurrency 1 below.
            echo "LLM_MODEL_MAIN=gemini/gemini-3.5-flash-lite"
            echo "LANGFUSE_ENABLED=false"
            echo "JWT_SECRET=$(pw)$(pw)"; echo "DEMO_USERNAME=demo"; echo "DEMO_PASSWORD=$(pw)"
          } > .env
      - name: Cache the Olist CSVs
        if: env.HAS_SECRETS == 'true'
        uses: actions/cache@v4
        with:
          path: backend/data/raw
          key: olist-brazilian-ecommerce-v2
      - name: Download the Olist dataset
        if: env.HAS_SECRETS == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ ! -f data/raw/olist_orders_dataset.csv ]; then
            uvx kaggle datasets download -d olistbr/brazilian-ecommerce -p data/raw --unzip
          fi
      - name: Start postgres and redis
        if: env.HAS_SECRETS == 'true'
        run: docker compose -f ../docker-compose.yml --env-file .env up -d --wait postgres redis
      - name: Migrate, load the data, build the catalog
        if: env.HAS_SECRETS == 'true'
        run: |
          uv run python -m text2sql.db migrate
          uv run python -m text2sql.db load-olist
          uv run python -m text2sql.db refresh-views
          uv run python -m text2sql.db catalog
      - name: Run the smoke evaluation (fails below the thresholds)
        if: env.HAS_SECRETS == 'true'
        # One question at a time and no fallback: stays inside the free-tier rate limits;
        # rate-limited questions are retried, then excluded as infrastructure errors.
        run: uv run python ../eval/run_eval.py --smoke --no-cache --no-fallback --concurrency 1
      - name: Upload the reports
        if: always() && env.HAS_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-report
          path: eval/reports/
