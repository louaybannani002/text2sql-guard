# The whole app: postgres + redis + API + web UI. Credentials come from backend/.env:
#   cd backend && make up          (everything, built from source; http://localhost:3000)
#   cd backend && make services    (postgres + redis only, for `make run` / `pnpm dev`)
# Ports are published on 127.0.0.1 only.
name: text2sql-guard

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first start (empty volume). `make down-volumes` to re-run.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Password is read from the container env at start-up, not baked into the compose file.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    image: text2sql-guard-api
    restart: unless-stopped
    # The same .env as on the host; only the service hosts differ inside the network.
    env_file: ./backend/.env
    environment:
      DATABASE_HOST: postgres:5432
      REDIS_HOST: redis:6379
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  web:
    build:
      context: ./frontend
      args:
        # Where the *browser* reaches the API (the port published above).
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-8000}
    image: text2sql-guard-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  postgres-data:
  redis-data:
