[project]
name = "text2sql-guard"
version = "0.1.0"
description = "Production-grade, guarded Text-to-SQL service."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "litellm>=1.104.0",
    "openai>=2.54.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "redis>=5.2",
    "sqlglot>=30.21.0",
    "structlog>=24.4",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "fakeredis>=2.39.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "CPY001", # license is declared once in LICENSE
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is how pytest works
    "D",       # test names are the documentation
    "PLR2004", # magic values are fine in tests
    "INP001",  # tests are collected via importlib, no __init__.py needed
    "S608",    # tests build SQL strings on purpose
    "S105",    # fake credentials for throwaway test databases
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["text2sql", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "."]
explicit_package_bases = true  # tests/ has same-named files (conftest.py) in several dirs
packages = ["text2sql"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m",
    "not integration",
]
markers = ["integration: needs the docker-compose services (`make up`); run with `make test-integration`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"  # integration tests share session connections
filterwarnings = [
    "error",
    # Raised by pydantic on LiteLLM's own TypedDicts; nothing we can fix on our side.
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
]
